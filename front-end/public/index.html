<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Tracker</title>
    <!--
      The social preview card. A phone browser that shows a bookmark or a top site as a wide tile, and every chat
      app that unfurls a link, reads these tags off the loaded document and paints og:image; without one they fall
      back to the favicon, blown up and cropped. The URL has to be absolute, so it names the deployed origin
      rather than the origin the page happens to be served from, and og_banner.png is copied into the build root
      under a fixed name for it to keep resolving.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Media Tracker" />
    <meta property="og:title" content="Media Tracker" />
    <meta property="og:description" content="Keep track of the books, movies, TV shows and videogames you own, are following and want to get to." />
    <meta property="og:url" content="https://media-tracker-front-end.onrender.com/" />
    <meta property="og:image" content="https://media-tracker-front-end.onrender.com/og_banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Media Tracker logo and name" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      The boot placeholder: the app shell background and the same loading spinner the first React screen renders,
      painted straight from the HTML so the page is not a white rectangle until the bundle has downloaded and run.
      React clears #root on its first commit, so the placeholder needs no teardown code. The spinner fades in a beat
      late, so that a warm cache boots straight from the background into the app without a spinner blinking on and
      off, while a slow one still gets something to look at.

      These rules cannot use app/web/styles.css, which only arrives with the bundle, so they are the only place in
      the project that repeats its literal values: --color-background-app, --color-scrim-strong,
      --color-surface-overlay-border and --color-accent, plus the .loading-indicator-container-full-screen and
      .loading-indicator-spinner geometry. tests/boot-placeholder.test.ts keeps the copies honest.
    -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #0f151d;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 18, 0.62);
      }

      .app-boot-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.16);
        border-top-color: #408cff;
        opacity: 0;
        animation:
          app-boot-spin 0.8s linear infinite,
          app-boot-fade-in 0.3s ease-out 0.25s forwards;
      }

      @keyframes app-boot-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-boot-fade-in {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot">
        <div class="app-boot-spinner"></div>
      </div>
    </div>
  </body>
</html>
